services:
  ch12-backend:
    extends: {file: compose.yaml, service: backend}
    image: marketplace-lab-backend
    profiles: [chapter12]
    env_file:
      - path: .ch12.env
        required: false
    ports: !override ["127.0.0.1:58012:8000"]
    environment:
      CH12_HOSTING_LAB: 'true'
      INITIALIZE_ON_STARTUP: 'false'
      DATABASE_URL: postgresql+psycopg://market:market-local@postgres:5432/ch12_hosting_lab
      READ_DATABASE_URL: postgresql://agent_reader:reader-local@postgres:5432/ch12_hosting_lab
      ALLOWED_ORIGINS: http://localhost:5192,http://127.0.0.1:5192
    volumes:
      - ./backend/marketplace:/app/marketplace:ro
  ch12-frontend:
    image: marketplace-lab-frontend
    profiles: [chapter12]
    depends_on: {ch12-backend: {condition: service_healthy}}
    ports: ["127.0.0.1:5192:80"]
    volumes:
      - ./infra/nginx.ch12.conf:/etc/nginx/conf.d/default.conf:ro
  ch12-mcp:
    image: marketplace-lab-backend
    profiles: [chapter12]
    command: [python, -m, marketplace.remote_mcp]
    env_file:
      - path: .ch12.env
        required: false
    environment:
      READ_DATABASE_URL: postgresql://agent_reader:reader-local@postgres:5432/ch12_hosting_lab
      LITELLM_URL: http://gateway:4000/v1
      LITELLM_API_KEY: ${SUPPORT_GATEWAY_KEY:-}
      DATA_DIR: /data
    volumes:
      - ./backend/marketplace:/app/marketplace:ro
      - ./data:/data:ro
    ports: ["127.0.0.1:58013:8001"]
