server {
  listen 80;
  root /usr/share/nginx/html;
  location / {
    # Canonical test host keeps cookies separate from the live localhost UI.
    if ($host = localhost) { return 307 http://127.0.0.1:5179$request_uri; }
    try_files $uri /index.html;
    sub_filter_once on;
    sub_filter '<body>' '<body><div style="background:#fff3cd;color:#533f03;padding:10px;text-align:center;font:14px sans-serif">TEST WORKSPACE — market_test — resettable data. Use 127.0.0.1:5179.</div>';
  }
  location /api/ {
    proxy_pass http://memory-backend:8000;
    proxy_read_timeout 180s;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
