name: marketplace-lab
services:
  postgres:
    image: pgvector/pgvector@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_PASSWORD: local-bootstrap-only
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/01-market.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
  gateway:
    image: ghcr.io/berriai/litellm@sha256:87f34979b9f8cb274fac90ca8a4fdda07d8480de22755562a26adeb95ce20d02
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: .env
    environment:
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: pk-lf-marketplace-local
      LANGFUSE_SECRET_KEY: sk-lf-marketplace-local
      OPENAI_MODEL: openai/gpt-5.4-2026-03-05
      LITELLM_MASTER_KEY: sk-marketplace-local
      DATABASE_URL: postgresql://litellm:litellm-local@postgres:5432/litellm
      STORE_MODEL_IN_DB: "True"
      PRESIDIO_ANALYZER_API_BASE: http://presidio-analyzer:3000
      PRESIDIO_ANONYMIZER_API_BASE: http://presidio-anonymizer:3000
    depends_on:
      postgres: {condition: service_healthy}
    volumes: ["${LITELLM_CONFIG_PATH:-./infra/litellm.yaml}:/app/config.yaml:ro", "./infra/gateway_audit.py:/app/gateway_audit.py:ro"]
    ports: ["127.0.0.1:4000:4000"]
  backend:
    build: ./backend
    depends_on:
      postgres: {condition: service_healthy}
      gateway: {condition: service_started}
    environment:
      DATABASE_URL: postgresql+psycopg://market:market-local@postgres:5432/market
      READ_DATABASE_URL: postgresql://agent_reader:reader-local@postgres:5432/market
      DATA_DIR: /data
      LITELLM_URL: http://gateway:4000/v1
      LITELLM_API_KEY: ${SUPPORT_GATEWAY_KEY:-}
      OPERATOR_GATEWAY_KEY: ${OPERATOR_GATEWAY_KEY:-}
      LYZR_AGENT_ID: ${LYZR_AGENT_ID:-}
      LYZR_API_KEY: ${LYZR_API_KEY:-}
      GOOGLE_RUNTIME_RESOURCE: ${GOOGLE_RUNTIME_RESOURCE:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      MARKETPLACE_IDENTITY_NAMESPACE: ${MARKETPLACE_IDENTITY_NAMESPACE:-marketplace-local}
      ANSWER_STYLE: readable
      AGENT_MAX_TURNS: 8
      AGENT_TOOL_TRANSPORT: ${AGENT_TOOL_TRANSPORT:-mcp}
      AGENT_MAX_SECONDS: 150
      AGENT_MAX_COMPLETION_TOKENS: 4096
      AGENT_MAX_ESTIMATED_COST_USD: 1.0
      AGENT_INPUT_RATE: 2.5
      AGENT_OUTPUT_RATE: 15.0
      OPENAI_MODEL: gpt-5.4-2026-03-05
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: pk-lf-marketplace-local
      LANGFUSE_SECRET_KEY: sk-lf-marketplace-local
    volumes: ["./data:/data:ro"]
    ports: ["127.0.0.1:58000:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
  eval-runner:
    extends:
      service: backend
    profiles: [evaluation]
    image: marketplace-lab-backend
    ports: !reset []
    environment:
      DATABASE_URL: postgresql+psycopg://market:market-local@postgres:5432/market_eval
      READ_DATABASE_URL: postgresql://agent_reader:reader-local@postgres:5432/market_eval
      LITELLM_API_KEY: ${EVAL_GATEWAY_KEY:-}
      JUDGE_GATEWAY_KEY: ${JUDGE_GATEWAY_KEY:-}
      EVAL_OUTPUT: /results/evaluation.json
    volumes:
      - ./backend/marketplace:/app/marketplace:ro
      - ./eval:/eval:ro
      - ./results:/results
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5178:80"]
    depends_on:
      backend: {condition: service_healthy}
  redis:
    image: redis@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
    command: [redis-server, --requirepass, redis-local, --maxmemory-policy, noeviction]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: [CMD, redis-cli, -a, redis-local, ping]
      interval: 5s
      timeout: 3s
      retries: 30
  clickhouse:
    image: clickhouse/clickhouse-server@sha256:8a790dd3468db22b1d4e7b18a176f378ff5ff6053b9c48dd4ea1fa71a24c5ba6
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse-local
    volumes: ["clickhouse-data:/var/lib/clickhouse"]
    healthcheck:
      test: [CMD, wget, --spider, -q, http://localhost:8123/ping]
      interval: 5s
      timeout: 3s
      retries: 30
  minio:
    image: cgr.dev/chainguard/minio@sha256:6a1d0b45c8669726bba580ced0bfa4cb9fdeed1ed636dfabd81d1577beb6937b
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-local-secret
    volumes: ["minio-data:/data"]
    ports: ["127.0.0.1:9090:9000"]
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 3s
      retries: 30
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker@sha256:3568d2d1eb5dd570f4087b37972ddffa3f6ae4f872553e0b0e2eedf4896a29e9
    depends_on: &lf-dependencies
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      minio: {condition: service_healthy}
    environment: &lf-env
      DATABASE_URL: postgresql://langfuse:langfuse-local@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      SALT: marketplace-local-salt
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse-local
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: redis-local
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: minio-local-secret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: minio-local-secret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse@sha256:755b821ba8f73a20d43d90e68f2b75d2f597dd164c55890f67a05f5a8d0f0e24
    depends_on: *lf-dependencies
    ports: ["127.0.0.1:3000:3000"]
    environment:
      <<: *lf-env
      NEXTAUTH_SECRET: marketplace-demo-local-auth-secret
      LANGFUSE_INIT_ORG_ID: marketplace-lab
      LANGFUSE_INIT_ORG_NAME: Marketplace Lab
      LANGFUSE_INIT_PROJECT_ID: marketplace-support
      LANGFUSE_INIT_PROJECT_NAME: Support experiments
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-marketplace-local
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-marketplace-local
      LANGFUSE_INIT_USER_EMAIL: operator@example.local
      LANGFUSE_INIT_USER_NAME: Demo operator
      LANGFUSE_INIT_USER_PASSWORD: demo-marketplace
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
volumes:
  postgres-data:
  redis-data:
  clickhouse-data:
  minio-data:
