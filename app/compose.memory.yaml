# Optional, separate memory-test UI. The normal frontend/backend remain on market.
services:
  memory-backend:
    extends:
      file: compose.yaml
      service: backend
    environment:
      MARKETPLACE_IDENTITY_NAMESPACE: marketplace-local-test
      EVAL_GATEWAY_KEY: ${EVAL_GATEWAY_KEY:-}
      LITELLM_API_KEY: ${TEST_SUPPORT_GATEWAY_KEY:-}
      OPERATOR_GATEWAY_KEY: ${TEST_OPERATOR_GATEWAY_KEY:-}
      GATEWAY_MODEL_DEMO_ENABLED: "true"
      GATEWAY_MODEL_DEMO_ADMIN_KEY: ${LITELLM_MASTER_KEY:-sk-marketplace-local}
      MEM0_API_KEY: ${MEM0_API_KEY:-}
      MEM0_IDLE_TIMEOUT_SECONDS: ${MEM0_IDLE_TIMEOUT_SECONDS:-900}
      MEM0_USER_NAMESPACE: marketplace-test
      DATABASE_URL: postgresql+psycopg://market:market-local@postgres:5432/market_test
      READ_DATABASE_URL: postgresql://agent_reader:reader-local@postgres:5432/market_test
      ALLOWED_ORIGINS: http://127.0.0.1:5179
    ports: !reset []
  memory-frontend:
    extends:
      file: compose.yaml
      service: frontend
    depends_on: !override
      memory-backend: {condition: service_healthy}
    ports: !override ["127.0.0.1:5179:80"]
    volumes:
      - ./infra/nginx-memory.conf:/etc/nginx/conf.d/default.conf:ro
