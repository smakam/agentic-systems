name: marketplace-user-mcp

services:
  identity:
    image: quay.io/keycloak/keycloak@sha256:3879c623248408de29a5303178b5816c77e8dfef3890c361f8c0bbeaa979ba3b
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: experiment-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run user-mcp/setup.py first}
      KC_HOSTNAME: ${USER_MCP_BASE_URL:?Set the public HTTPS origin}/identity
      KC_HTTP_RELATIVE_PATH: /identity
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./.user-mcp/marketplace-realm.json:/opt/keycloak/data/import/marketplace-realm.json:ro
      - identity-data:/opt/keycloak/data
    ports: ["127.0.0.1:58501:8080"]

  orders:
    image: marketplace-lab-backend
    command: [python, -m, marketplace.user_mcp]
    environment:
      DATABASE_URL: postgresql+psycopg://market:market-local@postgres:5432/market
      USER_MCP_RESOURCE_URL: ${USER_MCP_BASE_URL}/mcp
      USER_MCP_ISSUER_URL: ${USER_MCP_BASE_URL}/identity/realms/marketplace
      USER_MCP_JWKS_URL: http://identity:8080/identity/realms/marketplace/protocol/openid-connect/certs
      USER_MCP_IDENTITY_LINKS: /config/identity-links.json
    volumes:
      - ./backend/marketplace:/app/marketplace:ro
      - ./.user-mcp/identity-links.json:/config/identity-links.json:ro
    networks: [default, marketplace-data]

  proxy:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    depends_on: [identity, orders]
    volumes:
      - ./.user-mcp/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:58002:8080"]

networks:
  marketplace-data:
    external: true
    name: marketplace-lab_default

volumes:
  identity-data:
